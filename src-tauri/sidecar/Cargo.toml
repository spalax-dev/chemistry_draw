[package]
name = "indigo-server"
version = "0.1.7"
edition = "2021"

[lib]
name = "indigo_server"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "indigo-server"
path = "src/main.rs"
test = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
base64 = "0.22"
libc = "0.2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Dynamically loaded at runtime, so there is no link-time dependency on
# libonnxruntime: release packages ship the runtime next to the sidecar, while
# development and tests get it from scripts/fetch-onnxruntime.sh via
# ORT_DYLIB_PATH.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-31", "load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
png = "0.18"
tower = "0.5"
