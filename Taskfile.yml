version: '3'

vars:
  SIDECAR_DIR: src-tauri/sidecar
  LIB_PATH: src-tauri/lib/linux-x86_64

tasks:
  test:
    desc: Run tests for Indigo + Imago
    dir: '{{.SIDECAR_DIR}}'
    env:
      LD_LIBRARY_PATH: '../../{{.LIB_PATH}}:$LD_LIBRARY_PATH'
    cmds:
      - cargo test

  run:
    desc: Build sidecar, kill stale process on port 9321, then start Tauri dev
    env:
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
    deps:
      - task: build-sidecar
    cmds:
      - pkill -9 indigo-server || true
      - sleep 1
      - pnpm tauri dev

  build-sidecar:
    internal: true
    env:
      LD_LIBRARY_PATH: '{{.LIB_PATH}}:$LD_LIBRARY_PATH'
    cmds:
      - cargo build --release -p indigo-server --bin indigo-server
      - cargo build --release -p indigo-server --bin imago-worker
      - cp target/release/indigo-server target/release/indigo-server-x86_64-unknown-linux-gnu
      - cp target/release/imago-worker target/release/imago-worker-x86_64-unknown-linux-gnu 2>/dev/null || cp target/release/imago-worker target/release/imago-worker-x86_64-unknown-linux-gnu

  libs:
    desc: Build the native Indigo/Imago libs in Docker and copy them into src-tauri/lib (needed for dev and CI)
    deps:
      - task: builder-image
    cmds:
      - |
        mkdir -p src-tauri/lib/linux-x86_64
        docker run --rm -v "$(pwd):/app" chemistry-builder bash -c '
          cp /opt/chemistry/libs/*.so* /app/src-tauri/lib/linux-x86_64/
          rm -f /app/src-tauri/lib/linux-x86_64/libstdc++.so* \
                /app/src-tauri/lib/linux-x86_64/libgcc_s.so*
        '
      - ls -lh src-tauri/lib/linux-x86_64/

  clean:
    desc: Remove compiled artifacts (Rust target, dist)
    cmds:
      - cargo clean
      - cargo clean --manifest-path src-tauri/sidecar/Cargo.toml
      - rm -rf dist

  builder-image:
    desc: Build Docker builder image (Debian 12, glibc 2.36). Use -- --no-cache to rebuild from scratch.
    cmds:
      - bash scripts/build-image.sh {{.CLI_ARGS}}

  deb:
    desc: Build .deb inside Docker (portable, glibc 2.36)
    deps:
      - task: builder-image
    cmds:
      - bash scripts/build-deb.sh

  appimage:
    desc: Build AppImage inside Docker (portable, glibc 2.36)
    deps:
      - task: builder-image
    cmds:
      - bash scripts/build-appimage.sh

  rpm:
    desc: Build .rpm inside Docker (portable, glibc 2.36)
    deps:
      - task: builder-image
    cmds:
      - bash scripts/build-rpm.sh

  packages:
    desc: Build deb, rpm and AppImage inside Docker (one pass)
    deps:
      - task: builder-image
    cmds:
      - bash scripts/build-packages.sh

  check-deps:
    desc: Check system dependencies for local development
    cmds:
      - bash scripts/check-deps.sh
