name: Build Windows installer
description: >-
  Build and validate the Windows x86_64 sidecar and NSIS installer. Node comes
  from `node-version-file: .nvmrc` and pnpm from the `packageManager` field in
  `package.json`; these two declarations are the only toolchain source of truth.

runs:
  using: composite
  steps:
    - name: Install Rust (MSVC)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: windows-msvc

    # Node is read from `.nvmrc` (24.20.0), the single source of truth.
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # No `version` input: pnpm comes from `packageManager` in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install frontend dependencies
      shell: pwsh
      run: pnpm install --frozen-lockfile

    - name: Set up MSVC x64 developer environment
      # Replaces ilammy/msvc-dev-cmd, which still declares node20. Loads
      # vcvars64.bat and exports its environment to the following steps;
      # dumpbin.exe/lib.exe and the MSVC linker come from it.
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe was not found at $vswhere"
        }
        $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $install) {
          throw "Visual Studio with the MSVC x64 toolchain was not found"
        }
        $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
        if (-not (Test-Path $vcvars)) {
          throw "vcvars64.bat was not found at $vcvars"
        }

        $script = Join-Path $env:RUNNER_TEMP "msvc-env.bat"
        @("call `"$vcvars`" >nul", "set") | Set-Content -Path $script -Encoding ascii

        $keep = @(
          "PATH", "INCLUDE", "LIB", "LIBPATH",
          "VSINSTALLDIR", "VCINSTALLDIR", "WindowsSdkDir", "WindowsSDKVersion",
          "UCRTVersion", "UniversalCRTSdkDir",
          "VSCMD_ARG_TGT_ARCH", "VSCMD_ARG_HOST_ARCH"
        )
        foreach ($line in (cmd /c "`"$script`"")) {
          if ($line -match '^([^=]+)=(.*)$' -and $keep -contains $Matches[1]) {
            $name = $Matches[1]
            $value = $Matches[2]
            Set-Item -Path "Env:$name" -Value $value
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }

        where.exe dumpbin.exe | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "dumpbin.exe was not found after vcvars64.bat" }
        where.exe lib.exe | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "lib.exe was not found after vcvars64.bat" }

    - name: Fetch Windows Indigo runtime
      shell: pwsh
      run: pwsh -NoProfile -File scripts/fetch-windows-libs.ps1

    - name: Add native libraries to PATH
      shell: pwsh
      run: |
        "$PWD\src-tauri\lib\windows-x86_64" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build sidecar (release)
      shell: pwsh
      run: cargo build --release -p indigo-server --bin indigo-server

    - name: Stage sidecar for Tauri bundling
      # Tauri expects externalBin paths suffixed with the target triple.
      shell: pwsh
      run: |
        Copy-Item target\release\indigo-server.exe `
          target\release\indigo-server-x86_64-pc-windows-msvc.exe

    - name: Run tests (Windows)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        node --test scripts/harness-lib.spec.mjs scripts/lib/release-workflow.test.mjs scripts/lib/windows-bundle.test.mjs
        if ($LASTEXITCODE -ne 0) { throw "Node tests failed" }
        cargo test -p indigo-server
        if ($LASTEXITCODE -ne 0) { throw "Sidecar tests failed" }

    - name: Smoke-test the sidecar
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $exe = "target\release\indigo-server.exe"
        $stdout = Join-Path $env:RUNNER_TEMP "indigo-server.out.log"
        $stderr = Join-Path $env:RUNNER_TEMP "indigo-server.err.log"
        $env:INDIGO_PORT = "19321"
        # Point the sidecar at a fresh, empty model root: the runner never
        # downloads the weights, so the catalog must report itself unready.
        $env:CHEMISTRY_MODELS_DIR = Join-Path $env:RUNNER_TEMP "clean-models"
        New-Item -ItemType Directory -Force -Path $env:CHEMISTRY_MODELS_DIR | Out-Null
        # The CI process has no piped stdin, so the parent watchdog would see
        # immediate EOF. Disable it for the standalone smoke run.
        $env:INDIGO_NO_PARENT_WATCHDOG = "1"

        $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
          -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        try {
          $deadline = (Get-Date).AddSeconds(30)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              $log = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "indigo-server exited early ($($proc.ExitCode)): $log"
            }
            $text = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            if ($text -match "INDIGO_PORT=(\d+)") {
              $port = [int]$Matches[1]
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "indigo-server did not report INDIGO_PORT within 30s" }

          $base = "http://127.0.0.1:$port/v2"
          $info = $null
          $infoDeadline = (Get-Date).AddSeconds(15)
          while (-not $info -and (Get-Date) -lt $infoDeadline) {
            try {
              $info = Invoke-WebRequest -Uri "$base/info"
            }
            catch {
              # The port line is printed just before axum starts serving.
              if ($proc.HasExited) { throw "indigo-server exited while waiting for /v2/info" }
              Start-Sleep -Milliseconds 250
            }
          }
          if (-not $info) { throw "/v2/info did not become reachable on port $port" }
          if ($info.StatusCode -ne 200) {
            throw "/v2/info returned $($info.StatusCode), expected 200"
          }
          $infoJson = $info.Content | ConvertFrom-Json
          if (-not ($infoJson.PSObject.Properties.Name -contains "imago_versions")) {
            throw "/v2/info must expose the imago_versions capability field: $($info.Content)"
          }
          if (@($infoJson.imago_versions).Count -ne 0) {
            throw "/v2/info must advertise no capabilities on a model-less runner: $($info.Content)"
          }

          # The empty model root must report an unready, idle catalog and the
          # pinned total from the compiled catalog (never a download).
          $models = Invoke-WebRequest -Uri "$base/models"
          if ($models.StatusCode -ne 200) {
            throw "/v2/models returned $($models.StatusCode), expected 200"
          }
          $modelsJson = $models.Content | ConvertFrom-Json
          if ($modelsJson.ready -ne $false) {
            throw "/v2/models must report ready: false on an empty root: $($models.Content)"
          }
          if ($modelsJson.manifest_present -ne $false) {
            throw "/v2/models must report manifest_present: false on an empty root: $($models.Content)"
          }
          if ($modelsJson.installed_bytes -ne 0) {
            throw "/v2/models must report 0 installed bytes on an empty root: $($models.Content)"
          }
          if ($modelsJson.total_bytes -ne 323987190) {
            throw "/v2/models must report the pinned 323987190 total bytes: $($models.Content)"
          }
          if ($modelsJson.download.state -ne "idle") {
            throw "/v2/models must report an idle download on an empty root: $($models.Content)"
          }

          $health = Invoke-WebRequest -Uri "$base/health"
          if ($health.StatusCode -ne 200) {
            throw "/v2/health returned $($health.StatusCode), expected 200"
          }
          $healthJson = $health.Content | ConvertFrom-Json
          if ($null -ne $healthJson.imago_worker) {
            throw "/v2/health still exposes imago_worker"
          }
          if ($null -ne $healthJson.imago_versions) {
            throw "/v2/health still exposes imago_versions"
          }

          $fixture = "src-tauri\sidecar\fixtures\caffeine.png"
          if (-not (Test-Path $fixture)) { throw "missing fixture $fixture" }
          $upload = Invoke-WebRequest -Method POST -Uri "$base/imago/uploads" `
            -InFile $fixture -ContentType "image/png" -SkipHttpErrorCheck
          if ($upload.StatusCode -ne 200) {
            throw "/v2/imago/uploads returned $($upload.StatusCode), expected 200"
          }
          $uploadJson = $upload.Content | ConvertFrom-Json
          $uploadId = [string]$uploadJson.upload_id
          if (-not $uploadId) {
            throw "/v2/imago/uploads returned no upload_id: $($upload.Content)"
          }

          $unknown = Invoke-WebRequest `
            -Uri "$base/imago/uploads/00000000-0000-0000-0000-000000000000" `
            -SkipHttpErrorCheck
          if ($unknown.StatusCode -ne 404) {
            throw "unknown upload id returned $($unknown.StatusCode), expected 404"
          }

          # Poll briefly so the job can leave PENDING. Models are not required
          # on the runner, so a terminal FAILURE (model unavailable) is fine;
          # a still-PENDING job is accepted rather than failed.
          $job = $null
          $jobDeadline = (Get-Date).AddSeconds(10)
          do {
            $job = Invoke-WebRequest -Uri "$base/imago/uploads/$uploadId" -SkipHttpErrorCheck
            if ($job.StatusCode -ne 200) {
              throw "GET /v2/imago/uploads/$uploadId returned $($job.StatusCode), expected 200"
            }
            $jobJson = $job.Content | ConvertFrom-Json
            if ($jobJson.state -ne "PENDING") { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $jobDeadline)
          if (-not $jobJson.state) {
            throw "GET /v2/imago/uploads/$uploadId returned no state: $($job.Content)"
          }
          Write-Host "Recognition job $uploadId state: $($jobJson.state)"

          Write-Host "Sidecar smoke test passed on port $port"
        }
        finally {
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
        }

    - name: Build NSIS installer
      shell: pwsh
      run: pnpm tauri build --bundles nsis
