name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          tags: chemistry-builder:latest
          load: true
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Build native libs
        # They are not vendored; the tests and the sidecar need them.
        run: |
          mkdir -p src-tauri/lib/linux-x86_64
          docker run --rm -v "$PWD:/app" chemistry-builder bash -c '
            cp /opt/chemistry/libs/*.so* /app/src-tauri/lib/linux-x86_64/
            rm -f /app/src-tauri/lib/linux-x86_64/libstdc++.so* /app/src-tauri/lib/linux-x86_64/libgcc_s.so*
          '

      - name: Run sidecar tests
        run: cargo test
        working-directory: src-tauri/sidecar
        env:
          LD_LIBRARY_PATH: ../../src-tauri/lib/linux-x86_64

      - name: Build frontend
        run: pnpm build

      - name: Lint frontend
        run: |
          pnpm run lint
          pnpm run format:check

      # tauri-build validates bundle.externalBin while compiling the host, so
      # these binaries must exist before `cargo clippy --workspace`.
      - name: Build sidecar
        env:
          LD_LIBRARY_PATH: src-tauri/lib/linux-x86_64
        run: >
          cargo build --release -p indigo-server --bin indigo-server --bin imago-worker &&
          cp target/release/indigo-server target/release/indigo-server-x86_64-unknown-linux-gnu &&
          cp target/release/imago-worker target/release/imago-worker-x86_64-unknown-linux-gnu

      - name: Lint Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

  windows:
    name: Windows build (NSIS, no Imago)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up MSVC x64 developer environment
        # Provides dumpbin.exe/lib.exe and the MSVC linker.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch Windows Indigo runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-windows-libs.ps1

      - name: Add native libraries to PATH
        shell: pwsh
        run: |
          "$PWD\src-tauri\lib\windows-x86_64" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build sidecar (release)
        run: cargo build --release -p indigo-server --bin indigo-server

      - name: Stage sidecar for Tauri bundling
        # Tauri expects externalBin paths suffixed with the target triple.
        shell: pwsh
        run: |
          Copy-Item target\release\indigo-server.exe `
            target\release\indigo-server-x86_64-pc-windows-msvc.exe

      - name: Run harness (Windows tests + lint)
        run: node scripts/harness.mjs

      - name: Smoke-test the sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "target\release\indigo-server.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "indigo-server.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "indigo-server.err.log"
          $env:INDIGO_PORT = "19321"
          # The CI process has no piped stdin, so the parent watchdog would
          # see immediate EOF. Disable it for the standalone smoke run.
          $env:INDIGO_NO_PARENT_WATCHDOG = "1"

          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                $log = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "indigo-server exited early ($($proc.ExitCode)): $log"
              }
              $text = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
              if ($text -match "INDIGO_PORT=(\d+)") {
                $port = [int]$Matches[1]
                $ready = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "indigo-server did not report INDIGO_PORT within 30s" }

            $base = "http://127.0.0.1:$port/v2"
            $info = $null
            $infoDeadline = (Get-Date).AddSeconds(15)
            while (-not $info -and (Get-Date) -lt $infoDeadline) {
              try {
                $info = Invoke-WebRequest -Uri "$base/info"
              }
              catch {
                # The port line is printed just before axum starts serving.
                if ($proc.HasExited) { throw "indigo-server exited while waiting for /v2/info" }
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $info) { throw "/v2/info did not become reachable on port $port" }
            if ($info.Content -notmatch '"imago_versions"\s*:\s*\[\s*\]') {
              throw "/v2/info did not report an empty imago_versions array: $($info.Content)"
            }

            $health = Invoke-WebRequest -Uri "$base/health"
            $healthJson = $health.Content | ConvertFrom-Json
            if ($healthJson.imago_worker.found -ne $false) {
              throw "/v2/health reported imago_worker.found = $($healthJson.imago_worker.found)"
            }
            if ($health.Content -notmatch '"imago_versions"\s*:\s*\[\s*\]') {
              throw "/v2/health did not report an empty imago_versions array: $($health.Content)"
            }

            $upload = Invoke-WebRequest -Method POST -Uri "$base/imago/uploads" `
              -Body "{}" -ContentType "application/json" -SkipHttpErrorCheck
            if ($upload.StatusCode -ne 404) {
              throw "/v2/imago/uploads returned $($upload.StatusCode), expected 404"
            }

            Write-Host "Sidecar smoke test passed on port $port (no Imago)"
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-draw-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
