name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          tags: chemistry-builder:latest
          load: true
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Build native libs
        # They are not vendored; the tests and the sidecar need them.
        run: |
          mkdir -p src-tauri/lib/linux-x86_64
          docker run --rm -v "$PWD:/app" chemistry-builder bash -c '
            cp /opt/chemistry/libs/*.so* /app/src-tauri/lib/linux-x86_64/
            rm -f /app/src-tauri/lib/linux-x86_64/libstdc++.so* /app/src-tauri/lib/linux-x86_64/libgcc_s.so*
          '

      - name: Run Node tests
        run: node --test scripts/lib/*.test.mjs

      - name: Run sidecar tests
        run: cargo test
        working-directory: src-tauri/sidecar
        env:
          LD_LIBRARY_PATH: ../../src-tauri/lib/linux-x86_64

      - name: Build frontend
        run: pnpm build

      # tauri-build validates bundle.externalBin while compiling the host, so
      # these binaries must exist before any workspace build that touches the host.
      - name: Build sidecar
        env:
          LD_LIBRARY_PATH: src-tauri/lib/linux-x86_64
        run: >
          cargo build --release -p indigo-server --bin indigo-server &&
          cp target/release/indigo-server target/release/indigo-server-x86_64-unknown-linux-gnu

  windows:
    name: Windows build (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows installer
        uses: ./.github/actions/windows-build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-draw-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
