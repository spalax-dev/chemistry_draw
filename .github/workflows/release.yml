name: release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    name: Build & publish packages
    needs: [release-please]
    # `always()` so this still runs when release-please was skipped (release and
    # workflow_dispatch events). Note that a release created by release-please with
    # GITHUB_TOKEN does NOT emit a `release` event for other workflows, so we chain
    # off its outputs instead of relying on that event.
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The builder image compiles OpenCV + Indigo + Imago; the default runner
        # disk is not enough.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          tags: chemistry-builder:latest
          load: true
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Build .deb (Debian/Ubuntu)
        run: bash scripts/build-deb.sh

      - name: Build .rpm (Fedora/RHEL)
        run: bash scripts/build-rpm.sh

      - name: Build AppImage
        # Optional: linuxdeploy needs FUSE. Don't fail the release over it;
        # deb/rpm are the primary targets.
        continue-on-error: true
        run: bash scripts/build-appimage.sh

      - name: List artifacts
        run: ls -lh dist-packages/

      - name: Verify package metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          deb=$(ls dist-packages/*.deb | head -1)
          rpmf=$(ls dist-packages/*.rpm | head -1)
          echo "== $deb =="
          dpkg-deb -I "$deb"
          echo "== $rpmf =="
          rpm -qpi "$rpmf"
          rpm -qpR "$rpmf"

      - name: Upload release assets
        if: |
          github.event_name == 'release' ||
          needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || needs.release-please.outputs.tag }}
          fail_on_unmatched_files: false
          files: |
            dist-packages/*.deb
            dist-packages/*.rpm
            dist-packages/*.AppImage

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-draw-packages
          path: dist-packages/*
          if-no-files-found: error
